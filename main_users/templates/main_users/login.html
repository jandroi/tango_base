{% extends 'main_home/base.html' %}

{% block content %}
<main class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-700/60 shadow-[0_8px_30px_rgba(0,0,0,0.12)]">
        <div class="border-b border-white/10 px-8 py-6 text-center bg-gradient-to-r from-[#4F4759]/90 to-[#7079A0]/90 rounded-t-3xl">
            <h1 class="text-4xl font-semibold text-white tracking-tight">Welcome back</h1>
            <p class="mt-2 text-[15px] text-slate-200 leading-relaxed">Sign in to continue to Tango</p>
        </div>

        <div class="px-8 py-8">
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                        <div
                            class="text-sm rounded-full px-4 py-2.5 border
                            {% if message.tags == 'success' %}
                                bg-emerald-50 text-emerald-800 border-emerald-200
                            {% elif message.tags == 'error' or message.tags == 'danger' %}
                                bg-red-50 text-red-800 border-red-200
                            {% elif message.tags == 'warning' %}
                                bg-amber-50 text-amber-800 border-amber-200
                            {% else %}
                                bg-blue-50 text-blue-800 border-blue-200
                            {% endif %}
                            ">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-2">
                        Email
                    </label>
                    <input
                        id="username"
                        name="username"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="Enter your email"
                        class="block w-full rounded-full border border-slate-700/60 px-5 py-3 text-slate-900
                               shadow-sm focus:outline-none focus:ring-2 focus:ring-[#8097D1]/20 focus:border-[#8097D1]
                               text-sm transition-all"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
                        Password
                    </label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        class="block w-full rounded-full border border-slate-700/60 px-5 py-3 text-slate-900
                               shadow-sm focus:outline-none focus:ring-2 focus:ring-[#8097D1]/20 focus:border-[#8097D1]
                               text-sm transition-all"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full rounded-full px-5 py-2.5 text-sm font-medium bg-slate-900/90 border border-slate-600/60 text-white hover:bg-slate-900 hover:border-slate-400/60 hover:-translate-y-[1px] hover:shadow-lg transition-all duration-200"
                >
                    Login
                </button>
            </form>

            <p class="mt-6 text-center text-[15px] text-slate-500">
                Don't have an account?
                <a href="{% url 'register' %}"
                   class="font-medium text-[#8097D1] hover:text-[#4F4759] transition-colors">
                    Create an account
                </a>
            </p>
        </div>
    </div>
</main>
{% endblock %}
