{% extends 'main_home/base.html' %}

{% block title %}Reset password{% endblock %}

{% block content %}
<main class="min-h-[calc(100vh-3.5rem)] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-700/60 shadow-[0_8px_30px_rgba(0,0,0,0.12)]">
        <div class="border-b border-white/10 px-8 py-6 text-center bg-gradient-to-r from-[#4F4759]/90 to-[#7079A0]/90 rounded-t-3xl">
            <h1 class="text-3xl font-semibold text-white tracking-tight">Reset password</h1>
            <p class="mt-2 text-[15px] text-slate-200">We'll email you a reset link</p>
        </div>

        <div class="px-8 py-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                    <input id="{{ form.email.id_for_label }}" name="email" type="email" required autocomplete="email"
                           placeholder="you@example.com"
                           class="block w-full rounded-full border border-slate-700/60 px-5 py-3 text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#8097D1]/20 focus:border-[#8097D1] text-sm transition-all">
                </div>

                <button type="submit"
                        class="w-full rounded-full px-5 py-2.5 text-sm font-medium bg-slate-900/90 border border-slate-600/60 text-white hover:bg-slate-900 hover:border-slate-400/60 hover:-translate-y-[1px] hover:shadow-lg transition-all duration-200">
                    Send reset link
                </button>
            </form>

            <p class="mt-6 text-center text-[15px] text-slate-500">
                <a href="{% url 'login' %}" class="font-medium text-[#8097D1] hover:text-[#4F4759]">Back to login</a>
            </p>
        </div>
    </div>
</main>
{% endblock %}
