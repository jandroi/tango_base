{% extends 'main_home/base.html' %}

{% block title %}Password reset complete{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-5 py-16 text-center">
    <h1 class="text-3xl font-semibold tracking-tight text-slate-900 mb-4">Password reset</h1>
    <p class="text-slate-500 leading-relaxed mb-8">
        Your password has been updated. You can now sign in with the new credentials.
    </p>
    <a href="{% url 'login' %}"
       class="inline-block rounded-full px-6 py-3 text-sm font-medium bg-slate-900/90 border border-slate-600/60 text-white hover:bg-slate-900 hover:border-slate-400/60 transition-all duration-200">
        Go to login
    </a>
</div>
{% endblock %}
